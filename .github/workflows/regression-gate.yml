name: Kairos integrated correctness gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: kairos_test
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: ci-test-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kairos:ci-test-only-password@127.0.0.1:5432/kairos_test
      KAIROS_REPAIR010_DATABASE_URL: postgresql://kairos:ci-test-only-password@127.0.0.1:5432/kairos_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: ingest/go.mod
          cache-dependency-path: ingest/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-api.lock
            requirements-reviewer.lock
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-reviewer.lock
      - name: Verify preserved repair010 snapshot with its original verifier
        run: |
          mkdir -p "$RUNNER_TEMP/kairos-repair010"
          git archive 69432bd468e2d8ccefcf522d89365cbe32970d31 | tar -xf - -C "$RUNNER_TEMP/kairos-repair010"
          .venv/bin/python -m scripts.verify_repair010 --root "$RUNNER_TEMP/kairos-repair010"
      - name: Verify preserved retrieval011 snapshot with its original verifier
        run: |
          mkdir -p "$RUNNER_TEMP/kairos-retrieval011"
          git archive 78586f0e51ca8a42d632090bfe3c4fa877fa85f1 | tar -xf - -C "$RUNNER_TEMP/kairos-retrieval011"
          .venv/bin/python -m scripts.verify_retrieval011 --root "$RUNNER_TEMP/kairos-retrieval011"
      - name: Verify preserved loop012 snapshot with its original verifier
        run: |
          mkdir -p "$RUNNER_TEMP/kairos-loop012"
          git archive 4f487000d5d6d92c10c4b08589d4dbf9644816ae | tar -xf - -C "$RUNNER_TEMP/kairos-loop012"
          .venv/bin/python -m scripts.verify_loop012 --root "$RUNNER_TEMP/kairos-loop012"
      - name: Verify current evaluation source and inherited evidence
        run: .venv/bin/python -m scripts.verify_evaluation013
      - name: Prepare isolated test database configuration
        run: |
          .venv/bin/python - <<'PYTHON'
          import os
          from pathlib import Path
          database = os.environ['TEST_DATABASE_URL']
          path = Path('.env.kairos.local')
          path.write_text('DATABASE_URL=' + database + '\nTEST_DATABASE_URL=' + database + '\n')
          path.chmod(0o600)
          PYTHON
      - name: Prepare local identity credentials
        run: KAIROS_IDENTITY_PREPARE_ONLY=1 .venv/bin/python scripts/setup_identity.py
      - name: Start official test identity provider
        run: >-
          docker run -d --name kairos-keycloak-ci
          --env-file .runtime/keycloak-bootstrap.env
          -p 127.0.0.1:8088:8080
          quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
          start-dev --http-port=8080 --hostname=http://127.0.0.1:8088
      - name: Provision synthetic realm and explicit memberships
        run: PYTHONPATH=. .venv/bin/python scripts/setup_identity.py
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Expose native PostgreSQL lifecycle tools
        run: |
          kairos_native_pg_bin=$(pg_config --bindir)
          test -x "$kairos_native_pg_bin/initdb"
          test -x "$kairos_native_pg_bin/pg_ctl"
          printf '%s\n' "$kairos_native_pg_bin" >> "$GITHUB_PATH"
          "$kairos_native_pg_bin/initdb" --version
      - name: Prepare pinned reference-free software verifier
        run: |
          docker pull python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
          kairos_fixture_image_id=$(docker image inspect --format '{{.Id}}' python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1)
          printf 'KAIROS_REPAIR010_IMAGE=%s\n' "$kairos_fixture_image_id" >> "$GITHUB_ENV"
      - name: Backend, real PostgreSQL, and actual OIDC flows
        run: .venv/bin/python -m scripts.acceptance007 backend
        env:
          KAIROS_TEST_IDENTITY_PROVIDER: '1'
          KAIROS_TEST_INVESTIGATION_DOCKER: '1'
          KAIROS_TEST_INVESTIGATION_IMAGE: ${{ env.KAIROS_REPAIR010_IMAGE }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - name: Current real OIDC reviewer journeys
        run: .venv/bin/python -m scripts.reviewer check --fullstack --runtime .runtime/ci007
      - name: Fixed synthetic calibration outcomes
        run: |
          .venv/bin/python scripts/run_evaluation.py --mode null-calibration --output /tmp/null.json
          .venv/bin/python scripts/run_evaluation.py --mode planted-regression --output /tmp/planted.json
          .venv/bin/python -c "import json; assert json.load(open('/tmp/null.json'))['gate']['verdict']=='pass'; assert json.load(open('/tmp/planted.json'))['gate']['verdict']=='fail'"
      - name: Redacted reviewer failure details
        if: failure()
        run: .venv/bin/python -m scripts.ci_diagnostics009 --runtime .runtime/ci007

  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: ingest/go.mod
          cache-dependency-path: ingest/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-reviewer.lock
      - name: Verify preserved repair010 snapshot with its original verifier
        run: |
          mkdir -p "$RUNNER_TEMP/kairos-repair010"
          git archive 69432bd468e2d8ccefcf522d89365cbe32970d31 | tar -xf - -C "$RUNNER_TEMP/kairos-repair010"
          .venv/bin/python -m scripts.verify_repair010 --root "$RUNNER_TEMP/kairos-repair010"
      - name: Verify preserved retrieval011 snapshot with its original verifier
        run: |
          mkdir -p "$RUNNER_TEMP/kairos-retrieval011"
          git archive 78586f0e51ca8a42d632090bfe3c4fa877fa85f1 | tar -xf - -C "$RUNNER_TEMP/kairos-retrieval011"
          .venv/bin/python -m scripts.verify_retrieval011 --root "$RUNNER_TEMP/kairos-retrieval011"
      - name: Verify preserved loop012 snapshot with its original verifier
        run: |
          mkdir -p "$RUNNER_TEMP/kairos-loop012"
          git archive 4f487000d5d6d92c10c4b08589d4dbf9644816ae | tar -xf - -C "$RUNNER_TEMP/kairos-loop012"
          .venv/bin/python -m scripts.verify_loop012 --root "$RUNNER_TEMP/kairos-loop012"
      - name: Verify current evaluation source and inherited evidence
        run: .venv/bin/python -m scripts.verify_evaluation013
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run test:browser
        working-directory: dashboard
      - name: Current recorded reviewer journeys
        run: .venv/bin/python -m scripts.reviewer check --recorded-only --runtime .runtime/recorded-ci007
      - run: npm audit --audit-level=low
        working-directory: dashboard
      - run: |
          npm run test:boundary
          npm run test:client
          npm run test:recorded
          npm run lint
          npm run typecheck
          npm run build
        working-directory: dashboard
      - name: Redacted reviewer failure details
        if: failure()
        run: .venv/bin/python -m scripts.ci_diagnostics009 --runtime .runtime/recorded-ci007
