services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${KAIROS_POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: kairos
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kairos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  kairos_postgres:
